[package]
name = "evan-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# TUI Framework
ratatui = { version = "0.28", features = ["serde"] }
crossterm = "0.29"

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
